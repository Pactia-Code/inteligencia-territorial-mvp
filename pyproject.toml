[project]
name = "territorial"
version = "0.1.0"
description = "MVP Inteligencia Territorial — Pactia. Validación de capacidades agénticas."
requires-python = ">=3.12"

dependencies = [
    # Configuración
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Almacenamiento estructurado
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # Datos
    "polars>=1.17",
    # LLM vía Azure OpenAI, superficie v1 (Addendum 02, D6 revisado 2026-09-11)
    "openai>=1.50",
    # Orquestación y observabilidad
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langfuse>=2.55",
    # Ingesta
    "httpx>=0.28",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12.24", "psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/territorial"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
